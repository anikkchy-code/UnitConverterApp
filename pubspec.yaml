name: unit_converter_app
description: "A Unit Converter App built in Flutter"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2  # স্টেট ম্যানেজমেন্টের জন্য প্রোভাইডার প্যাকেজ

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # যদি পরবর্তীতে কোনো কাস্টম ফন্ট বা ইমেজ অ্যাসেটস ব্যবহার করতে চান, তবে এখান থেকে এড করতে পারবেন।
